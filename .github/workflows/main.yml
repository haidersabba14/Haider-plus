
name: Build Haider Plus IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-haider-plus.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Create iPhone app
        shell: bash
        run: |
          set -euo pipefail

          cat > HaiderPlusApp.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct StoreItem: Identifiable {
              let id: String
              let subtitle: String
              let category: String
              let icon: String
              let link: String
              let isWebsite: Bool
          }

          @main
          struct HaiderPlusApp: App {
              var body: some Scene {
                  WindowGroup {
                      StoreView()
                          .preferredColorScheme(.dark)
                          .environment(\.layoutDirection, .rightToLeft)
                  }
              }
          }

          struct StoreView: View {
              private let gold = Color(
                  red: 0.93,
                  green: 0.73,
                  blue: 0.35
              )

              private let panel = Color(
                  red: 0.10,
                  green: 0.10,
                  blue: 0.12
              )

              @State private var search = ""
              @State private var category = "الكل"
              @State private var showNoLink = false

              // Add your apps and valid installation links here.

              private let apps: [StoreItem] = [
                  StoreItem(
                      id: "Haider Plus Demo",
                      subtitle: "تطبيق تجريبي",
                      category: "تطبيقات",
                      icon: "square.stack.3d.up.fill",
                      link: "",
                      isWebsite: false
                  ),
                  StoreItem(
                      id: "Haider Tools",
                      subtitle: "أدوات متنوعة",
                      category: "تطبيقات",
                      icon: "hammer.fill",
                      link: "",
                      isWebsite: false
                  ),
                  StoreItem(
                      id: "GitHub",
                      subtitle: "منصة المشاريع البرمجية",
                      category: "مواقع",
                      icon: "chevron.left.forwardslash.chevron.right",
                      link: "https://github.com",
                      isWebsite: true
                  ),
                  StoreItem(
                      id: "Cloudflare",
                      subtitle: "إدارة المواقع",
                      category: "مواقع",
                      icon: "cloud.fill",
                      link: "https://dash.cloudflare.com",
                      isWebsite: true
                  )
              ]

              private var filtered: [StoreItem] {
                  apps.filter { item in
                      (category == "الكل" ||
                       item.category == category) &&
                      (search.isEmpty ||
                       item.id.localizedCaseInsensitiveContains(search) ||
                       item.subtitle.localizedCaseInsensitiveContains(search))
                  }
              }

              var body: some View {
                  ZStack {
                      Color(
                          red: 0.035,
                          green: 0.035,
                          blue: 0.045
                      )
                      .ignoresSafeArea()

                      ScrollView {
                          VStack(
                              alignment: .leading,
                              spacing: 22
                          ) {
                              HStack(spacing: 12) {
                                  Image(systemName: "crown.fill")
                                      .font(.system(size: 32))
                                      .foregroundColor(gold)

                                  VStack(
                                      alignment: .leading,
                                      spacing: 4
                                  ) {
                                      Text("HAIDER PLUS")
                                          .font(
                                              .system(
                                                  size: 25,
                                                  weight: .black
                                              )
                                          )
                                          .foregroundColor(gold)

                                      Text("متجرك الخاص على الآيفون")
                                          .font(.subheadline)
                                          .foregroundColor(.gray)
                                  }

                                  Spacer()
                              }

                              VStack(
                                  alignment: .leading,
                                  spacing: 8
                              ) {
                                  Text("اكتشف التطبيقات")
                                      .font(.title2.bold())

                                  Text("متجر التطبيقات والأدوات")
                                      .font(.subheadline)
                                      .foregroundColor(.gray)
                              }

                              HStack(spacing: 10) {
                                  Image(
                                      systemName: "magnifyingglass"
                                  )
                                  .foregroundColor(gold)

                                  TextField(
                                      "ابحث عن تطبيق...",
                                      text: $search
                                  )
                                  .autocorrectionDisabled(true)
                              }
                              .padding(15)
                              .background(panel)
                              .cornerRadius(16)

                              HStack(spacing: 8) {
                                  ForEach(
                                      ["الكل", "تطبيقات", "مواقع"],
                                      id: \.self
                                  ) { option in
                                      Button {
                                          category = option
                                      } label: {
                                          Text(option)
                                              .font(.subheadline.bold())
                                              .foregroundColor(
                                                  category == option
                                                  ? .black : .white
                                              )
                                              .padding(.horizontal, 18)
                                              .padding(.vertical, 10)
                                              .background(
                                                  category == option
                                                  ? gold : panel
                                              )
                                              .cornerRadius(20)
                                      }
                                  }
                              }

                              ForEach(filtered) { item in
                                  HStack(spacing: 14) {
                                      Image(systemName: item.icon)
                                          .font(.system(size: 25))
                                          .foregroundColor(gold)
                                          .frame(
                                              width: 54,
                                              height: 54
                                          )
                                          .background(
                                              Color.black.opacity(0.35)
                                          )
                                          .cornerRadius(15)

                                      VStack(
                                          alignment: .leading,
                                          spacing: 5
                                      ) {
                                          Text(item.id)
                                              .font(.headline)

                                          Text(item.subtitle)
                                              .font(.caption)
                                              .foregroundColor(.gray)
                                              .fixedSize(
                                                  horizontal: false,
                                                  vertical: true
                                              )
                                      }

                                      Spacer(minLength: 4)

                                      Button {
                                          if item.link.isEmpty {
                                              showNoLink = true
                                          } else if let url = URL(
                                              string: item.link
                                          ) {
                                              UIApplication.shared.open(url)
                                          }
                                      } label: {
                                          Text(
                                              item.isWebsite
                                              ? "فتح" : "تثبيت"
                                          )
                                          .font(.subheadline.bold())
                                          .foregroundColor(.black)
                                          .padding(.horizontal, 14)
                                          .padding(.vertical, 10)
                                          .background(gold)
                                          .cornerRadius(12)
                                      }
                                  }
                                  .padding(14)
                                  .frame(maxWidth: .infinity)
                                  .background(panel)
                                  .cornerRadius(18)
                              }

                              Text("HAIDER PLUS")
                                  .font(.caption2)
                                  .foregroundColor(.gray)
                                  .frame(maxWidth: .infinity)
                          }
                          .padding(20)
                      }
                  }
                  .alert(
                      "لا يوجد رابط تثبيت",
                      isPresented: $showNoLink
                  ) {
                      Button(
                          "حسنًا",
                          role: .cancel
                      ) { }
                  } message: {
                      Text(
                          "أضف رابط توزيع موقّع وصالح للتطبيق."
                      )
                  }
              }
          }
          SWIFT

          cat > project.yml <<'PROJECT'
          name: HaiderPlus

          options:
            deploymentTarget:
              iOS: '15.0'

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.haiderplus.store
              SWIFT_VERSION: '5.0'
              TARGETED_DEVICE_FAMILY: '1,2'

          targets:
            HaiderPlus:
              type: application
              platform: iOS
              sources:
                - path: HaiderPlusApp.swift
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Haider Plus
                  CFBundleShortVersionString: '1.0'
                  CFBundleVersion: '1'
                  UIUserInterfaceStyle: Dark
                  UILaunchScreen: {}
          PROJECT

          xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project HaiderPlus.xcodeproj \
            -scheme HaiderPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO build

          mkdir -p Payload

          cp -R \
            .build/Build/Products/Release-iphoneos/HaiderPlus.app \
            Payload/

          codesign \
            --force \
            --sign - \
            --deep \
            --timestamp=none \
            Payload/HaiderPlus.app

          zip -qry HaiderPlus-unsigned.ipa Payload

          test -s HaiderPlus-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HaiderPlus-IPA
          path: HaiderPlus-unsigned.ipa
          retention-days: 7
